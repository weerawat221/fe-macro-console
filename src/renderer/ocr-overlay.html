<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcruro — Screen OCR</title>
  <link rel="icon" type="image/png" href="../../assets/icon.png" />
  <link rel="stylesheet" href="../../assets/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="ocrOverlay.css" />
</head>
<body>
  <div id="ocrApp" class="ocr-app">
    <!-- Fullscreen canvas for screenshot -->
    <canvas id="screenshotCanvas" class="screenshot-canvas"></canvas>

    <!-- Dimming SVG overlay -->
    <svg id="dimSvg" class="dim-svg"></svg>

    <!-- Crop Selection box (during phase 1 drag) -->
    <div id="selectionBox" class="selection-box" style="display:none;"></div>

    <!-- Lasso Selection box (during phase 2 drag to select words) -->
    <div id="lassoBox" class="lasso-box" style="display:none;"></div>

    <!-- Text word bounding boxes and assignment badges -->
    <div id="ocrBoxesContainer" class="ocr-boxes-container"></div>

    <!-- Floating Top Bar -->
    <header class="ocr-top-bar" id="topBar">
      <div class="ocr-top-left">
        <span class="ocr-pill-badge" data-i18n="ocr_title">OCR AUTO-INPUT</span>
        <span id="statusText" class="ocr-status-text" data-i18n="ocr_hint">Drag a box over text on screen (ESC to cancel)</span>
      </div>
      <div class="ocr-top-right">
        <button id="btnQuickRecall" class="btn btn--recall" style="display:none;" title="Re-apply last saved capture positions (Space)">
          <i class="fa-solid fa-bolt"></i> Auto-Fill Last Position
        </button>
        <button id="btnCancelTop" class="btn btn--ghost btn--icon" title="Cancel (Esc)" data-i18n-title="ocr_close"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </header>

    <!-- Floating Popover for assigning selected text to Variable -->
    <div id="varPopover" class="var-popover" style="display:none;">
      <div class="var-popover-header">
        <span class="var-popover-title">Selected Text (Editable):</span>
        <input type="text" id="popoverSelectedTextInput" class="var-popover-text-input" spellcheck="false" autocomplete="off" />
      </div>
      <div class="var-popover-search-wrap">
        <input type="text" id="popoverSearch" class="var-popover-search" placeholder="Search / Filter Variable..." autocomplete="off" />
      </div>
      <div id="varPopoverList" class="var-popover-list"></div>
    </div>

    <!-- Floating Bottom Action Bar -->
    <footer class="ocr-bottom-bar" id="bottomBar" style="display:none;">
      <div class="ocr-bottom-left">
        <button id="btnReselectArea" class="btn btn--ghost btn--sm"><i class="fa-solid fa-crop-simple"></i> Select New Area</button>
        <label class="ocr-checkbox-label">
          <input type="checkbox" id="chkRememberPos" checked />
          <span>Save positions for auto-input next time</span>
        </label>
      </div>
      <div class="ocr-bottom-right">
        <button id="btnCancelBottom" class="btn btn--ghost btn--sm" data-i18n="review_cancel">Cancel (Esc)</button>
        <button id="btnApplyValues" class="btn btn--primary btn--sm" disabled>
          <i class="fa-solid fa-check"></i> <span data-i18n="ocr_apply_btn">Apply to Macro</span>
        </button>
      </div>
    </footer>

    <!-- Loading Spinner Overlay -->
    <div id="ocrLoading" class="ocr-loading-overlay" style="display:none;">
      <div class="ocr-spinner"></div>
      <span class="ocr-loading-text">Recognizing text with Tesseract OCR…</span>
    </div>
  </div>

  <script type="module" src="ocrOverlayRenderer.js"></script>
</body>
</html>
